services:
  kariheya:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: kariheya
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      ENV_FILE: /app/.env
    volumes:
      - kariheya-data:/app/data
      - ./.env:/app/.env

volumes:
  kariheya-data:
